# Application identity
quarkus.application.name=event-gateway-poc

# Kafka topics
gateway.topic.in=edge.events.raw
gateway.topic.out=edge.events.processed

# Kafka connection — overridden by KAFKA_BOOTSTRAP_SERVERS at runtime (set by
# the OpenShift Deployment against the in-cluster AMQ Streams bootstrap service).
camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Gate for the Kafka-consuming route and publisher — disabled in tests so the
# application context boots without a reachable broker. See EdgeEventRoute
# and EventPublisher for why.
gateway.kafka-route.enabled=true
%test.gateway.kafka-route.enabled=false

# No local Kafka broker available in this dev environment (no Docker daemon
# running) — disable Dev Services rather than let Quarkus try and fail to
# provision one via Testcontainers. Full Kafka round-trip is verified against
# the deployed AMQ Streams cluster on OpenShift, not in this test suite.
%test.quarkus.kafka.devservices.enabled=false

# Container image build (used by `./mvnw package -Dquarkus.container-image.build=true`
# and by the OpenShift Pipeline)
quarkus.container-image.group=labandera
quarkus.container-image.name=event-gateway-poc
quarkus.container-image.tag=latest

# HTTP
quarkus.http.port=8080

# Swagger UI is dev-mode-only by default; this PoC is meant to be explored
# live, so keep it available in the packaged/prod build too.
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Event Gateway PoC
quarkus.smallrye-openapi.info-description=Reactive Kafka + Camel event-integration pattern, deployed live on Red Hat OpenShift.
quarkus.smallrye-openapi.info-version=1.0.0

# How many recent raw/processed events the in-memory dashboard keeps. Bounded
# so long-running instances don't grow memory unbounded; not persisted, so a
# pod restart clears it — acceptable for a PoC, not a design goal.
gateway.dashboard.buffer-size=50
